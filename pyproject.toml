[project]
name = "tariff-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
llm = ["anthropic>=0.40", "openai>=1.50"]

[tool.pytest.ini_options]
testpaths = ["tests"]
